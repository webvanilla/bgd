<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>3D Cabinet</title>
    <!-- Montserrat font for a modern, clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="overlay"></div>
    <!-- Skeleton loader displayed while the 3D model loads -->
    <div id="skeletonLoader" class="skeleton-loader">
      <div class="skeleton-item"></div>
    </div>
    <!-- Danger button that triggers the cabinet to fly across the screen -->
    <button id="dangerBtn" class="danger">⚠️ Danger</button>
    <button id="returnBtn" class="return">↩️ Return to Safety</button>
    <script type="module" src="/main.js"></script>
  </body>
</html>
