<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My first three.js app</title>
    <!-- Montserrat font for a modern, clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; }
      /* Overlay container that will host the drawer document */
      #overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 10;
        /* start hidden – will be animated to visible */
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      /* When the overlay should be visible */
      #overlay.visible {
        opacity: 1;
        transform: translateY(0);
      }
      /* Typewriter effect for streamed characters */
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
      .typewriter {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: .15em solid #000;
        animation: typing 2s steps(30, end) forwards;
      }
      .typewriter.finished {
        border-right: none;
      }
      /* Hide the close button until the typewriter animation finishes.
         The button appears after the .finished class is added to the
         .typewriter element. We use the sibling selector to reveal the
         button when the animation is done. */
      .close-doc {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .typewriter.finished ~ .close-doc {
        opacity: 1;
        pointer-events: auto;
      }
      /* Basic styling for the document content */
      /* Modern, professional document style */
      .doc {
        /* File‑card appearance, like a paper pulled from a folder */
        position: relative;
        background: #ffffff;
        padding: 30px 30px 30px 40px; /* extra left space for the tab */
        max-width: 80vw;
        max-height: 80vh;
        overflow: auto;
        border-radius: 4px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        font-family: 'Montserrat', sans-serif;
        color: #222;
        line-height: 1.6;
        /* Slight inner margin to suggest paper */
        margin-left: 20px;
      }
      /* Folder tab */
      .doc::before {
        content: '';
        position: absolute;
        top: -12px;
        left: 20px;
        width: 120px;
        height: 20px;
        background: #c4a484; /* a warm wood‑tone folder tab */
        border-radius: 4px 4px 0 0;
        box-shadow: inset 0 1px rgba(255,255,255,0.5);
      }
      .doc a {
        color: #66b3ff;
        text-decoration: none;
      }
      .doc a:hover {
        text-decoration: underline;
      }
      .doc a {
        color: #0066cc;
        text-decoration: none;
      }
      .doc a:hover {
        text-decoration: underline;
      }
      .doc button {
        margin-top: 10px;
      }
      /* Ancient scroll style */
      .scroll {
        /* Parchment‑like background – keep the existing texture but add a subtle
           sepia overlay to emulate the vintage look from the reference image. */
        background-image: url('filing_cabinet/textures/Paper_baseColor.jpeg');
        background-size: cover;
        background-position: center;
        padding: 30px;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        font-size: 1.1rem;
        color: #3b2e1a;
        border: 6px double #a67c52;
        border-radius: 4px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        background-color: #fdf6e3;
        /* Slightly aged parchment effect */
        filter: sepia(0.2) contrast(1.05);
      }

      /* Responsive typography for mobile devices – ensure text isn’t too small. */
      @media (max-width: 600px) {
        .scroll {
          font-size: 1.3rem;
        }
        .typewriter {
          font-size: 1.3rem;
        }
        .close-doc {
          font-size: 1rem;
        }
      }
          @media (max-width: 600px) {
        .scroll {
          font-size: 1.3rem;
        }
        .typewriter {
          font-size: 1.3rem;
        }
        .close-doc {
          font-size: 1rem;
        }
        .doc {
          padding: 20px 20px 20px 30px;
          max-width: 95vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="overlay"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
